spring.application.name=finpay-api

spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=finpay_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${FINPAY_DB_USERNAME}
spring.datasource.password=${FINPAY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=false
